go_home:
  ros__parameters:
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4

    step_names: [home]  # Names of the steps

    # 2026-10-16 AMR 부착용 납작 접기(위팔 뒤로 수평, 아래팔 위에 겹쳐 수평, 손목 64도).
    # 이전 [0.0, -2.07, 1.55, 1.10] → [0.0, -1.565, 1.562, 1.118](10-16).
    # 2026-10-18 joint2·3 을 닿는 자리보다 약 1도 앞으로(13번 과부하). SRDF home 과 같은 값을 유지할 것(이유는 SRDF 주석).
    # 2026-11-09 재조립 뒤 밑동이 틀어져 지지대에 얹힌 자리가 joint1 -1.2~-1.4도 → 홈 joint1 0 → -0.023(-1.3도).
    # 2026-11-09 손목을 손으로 위로 들어 놓은 실측 0.724(41.5도) — 막대가 위를 보게(사용자 요청). 이전 1.118(64도).
    # 2026-11-25 링크 일체형 재조립 뒤 손으로 놓은 실측: joint1 +0.016(+0.9~1.0도), 어깨 -1.549, 팔꿈치 1.559(닿는 자리 예전과 같음),
    #   손목 0.900(51.6도). 어깨·팔꿈치는 예전처럼 닿는 자리보다 약 1도 앞.
    #   손목은 0.724(41.5도) — 전완이 10 mm 짧아져 51.6도는 막대가 상완·어깨 충돌 박스와 1~2 mm 겹친다(MoveIt 출발 자세 충돌).
    #   45도부터 겹침, 41.5도 이하 깨끗(가짜 팔 MoveIt). 사용자 선택 41.5도.
    home: [0.016, -1.535, 1.540, 0.724]

    duration: 3.0
    epsilon: 0.01
    action_topic: '/arm_controller/follow_joint_trajectory'
    joint_states_topic: '/joint_states'
