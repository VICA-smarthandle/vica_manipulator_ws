# MoveIt 이 피해야 할 AMR 몸체·짐칸·마스트.
# 숫자는 전부 base_link 기준(x 앞, y 왼쪽, z 위)이고 단위는 m 다.
# base_link 는 구동 바퀴 축 가운데, 바닥에서 0.190 m 위다(주행 URDF VICA.xacro).
# load_scene.py 가 mount 를 빼서 팔 원점(world = 기둥 바닥 중심) 기준으로 바꿔 넣는다.

# base_link → 팔 world. 오른쪽 171.25 mm·바닥에서 415 mm 는 10-16 줄자 실측, 정면.
# 앞뒤는 10-18 실측 "앞 범퍼 → 기둥 가운데 125 mm 뒤" 로 고쳤다(범퍼 = base_link x 0.151, 주행 footprint).
# 10-16 의 "115" 는 범퍼에서 뒤로 잰 값이었는데 축에서 앞으로 잘못 읽어 x 0.115 로 넣었었다 — 접힌 막대 끝이
# 모델은 범퍼 밖 6.5 cm, 실측은 범퍼 안 2 cm 로 8.5 cm 어긋나 찾았다.
mount:
  xyz: [0.026, -0.17125, 0.225]
  yaw_deg: 0.0

boxes:
  # 차체. 바닥부터 기둥 바닥(바닥 0.415 m)보다 2 mm 아래까지 통째로 막는다.
  # 기둥이 상자에 닿아 있으면 MoveIt 이 출발부터 충돌로 보므로 2 mm 를 띄운다.
  # 앞뒤·좌우는 nav2 footprint(앞 0.151, 뒤 -0.459, 좌우 ±0.225). 뒤쪽 모따기는 무시한다.
  - name: amr_body
    center: [-0.154, 0.0, 0.0165]
    size: [0.610, 0.450, 0.413]

  # 짐칸 300 x 420 x 160 mm(420 이 앞뒤). 2026-10-16 사용자 실측.
  # 앞뒤는 10-18 실측 "범퍼 앞면 → 짐칸 앞면 64 mm" → 앞면 0.087, 중심 -0.123 (10-16 값 -0.113).
  # 좌우 0, 바닥 높이 0.445 m(base_link z 0.255) → 윗면 바닥에서 0.605 m.
  # 그래서 짐칸 앞면이 기둥 가운데(+0.026)보다 6 cm 앞이고, 짐칸은 팔 기둥 왼쪽(+y) 옆에 붙어 있다.
  # 좌우는 10-18 사용자 실측 "짐칸 오른쪽 면 ↔ 팔(어깨 브래킷) 틈 약 6 mm" 로 맞췄다. 브래킷(link2)은
  # 0도에서 기둥 가운데로부터 +0.0234 까지 나오므로 짐칸 오른쪽 면 = world y +0.0294 = base_link y −0.142,
  # 중심 y +0.008 (구조상 가운데라는 사용자 말과 8 mm 차).
  - name: cargo_bin
    center: [-0.123, 0.008, 0.335]
    size: [0.420, 0.300, 0.160]

  # 짐칸에 실은 박스 300(좌우) x 420(앞뒤) x 160 mm(10-22 사용자) — 넣지 않는다. 팔 쪽 옆면이 짐칸보다 7 cm 안쪽·짐칸 위로
  # 넣어 보니 사용자가 손으로 옮긴 길(config/paths/right.yaml)의 끝 6 초가 위팔과 겹친다고 나왔다 — 실물은 안 닿았다(사용자).
  # 높이·자리를 정확히 모르는 모델이 실제로 되는 길을 막으므로 빼고, 홈 ↔ 오른쪽은 사람이 옮긴 길을 그대로 따라간다

  # D455 마스트. 실측이 아니라 주행 URDF 메시(base_link_mast.stl)의 차체 위 부분 경계 상자다.
  # 팔 기둥에서 50 cm 넘게 뒤라 팔이 닿지 않는 거리지만, 계획이 뒤로 크게 돌지 않게 넣어 둔다.
  - name: mast
    center: [-0.512, 0.0, 0.554]
    size: [0.240, 0.040, 0.662]
