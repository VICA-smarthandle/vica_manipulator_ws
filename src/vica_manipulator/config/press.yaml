# 누르기 설정. press.py·pose.py 의 기본값이고 arm_service(NX 서비스)도 이 값을 쓴다.
# 손으로 시험할 때는 press.sh 옵션(--z-up --depth --contact-ma ...)으로 덮어쓴다.
# 단위 m·mA. [가정] = 실물로 아직 못 맞춘 값
hall:                    # up·down = 승강장 호출 버튼. 관찰 자세 front. **10-21 사용자 확정(픽스)** — 이 묶음·lit·speed 는
                         # 실물로 다시 맞출 때만 바꾼다(git 태그 hall-fix-20261021)
  pose: front
  cam_h: 1.05            # 카메라 바닥 높이. 10-20 실물 버튼 1.05 m 가 화면 위아래 가운데
  yaw_deg: 0             # 관찰 자세를 밑동에서 더 돌림(음수 = 오른쪽). 10-21 −25° 를 넣었다가 사용자가 정면(0)으로 되돌림.
                         # 돌리면 누르는 방향도 그쪽(밑동 → 버튼)이라 벽에 비스듬히 닿는다. 손 명령은 --yaw 로 시험
  z_up: 0.067            # 목표를 올림(팔이 처지는 만큼). 10-21 실물(카메라 거리 60~62 cm): 0.04·0.05 는 버튼 아래
                         # 테두리를 밀어 안 눌림, 0.065·0.07 눌림 → 0.065 로 정했다가 저녁에 또 아래를 눌러 사용자가 0.067.
                         # 접근점 사진으로 보면 회마다 막대 높이가 약 1.5 cm 오르내린다(팔 처짐·덜컥임은 모터 각도에 안 잡힘)
  depth: 0.005           # 버튼 면에서 최대 5 mm 더 민다. 그 전에 닿음 전류가 오르면 멈춘다
  contact_ma: 200        # 접근점 대비 이만큼 오르면 닿음. 10-20 실물 안 닿을 때 오름 최대 54 mA. 10-21 실물 150 은 안 눌림
  retract: 0.0           # 누른 뒤 곧게 뺄 거리. 0 = 바로 홈(10-21: 그 길에서 막대 끝이 뒤로 곧게 떨어져 판을 안 긁음)
  need_light: true       # 불빛 판정이 되는데 불이 끝내 안 켜지면 '안 눌림' 실패로 답한다(NX 가 다시 부르면 됨)
  mid: true              # 버튼 앞 20 cm 에서 멈춰 버튼을 다시 찾고 목표를 고친 뒤 누른다(아래 mid). 10-22 사용자 요청
  service_fallback: true # NX 서비스(/arm/press_up·down)는 press.py --fallback 으로: 카메라로 못 찾으면 마지막으로 성공한 버튼 자리
                         # (~/vica_arm_logs/last_press_<버튼>.json)로 같은 동작. 그 자리는 카메라로 누르기에 성공할 때마다 저장(10-22 사용자)
  aim: false             # 접근점 화살표 맞추기. 10-22 끔: 목표 (309, 250) 는 닿은 뒤 막대가 판을 타고 위로 미끄러지던 때
                         # (10-21 저녁, 1 단 누르기) 눌린 회차로 잡은 값이라, 미끄러지지 않는 2 단 누르기에선 버튼 아래를 민다.
                         # 막대가 실제로 닿는 줄(카메라 3.3 cm 아래)은 접근점 화면에서 막대에 가려 화살표로 못 맞춘다
  push: 0.009            # [가정] 10-22 사용자: 6 → 9 mm(3 mm 더). 닿으면(전류) 멈춘 뒤, 지금 실제 자세에서 높이는 그대로 앞으로만 더 미는 거리. 10-21 밤: 닿은 뒤에도
                         # '처지는 만큼 높게' 잡은 목표로 계속 밀면 판을 타고 위로 미끄러져 버튼 위쪽을 꾹 눌렀다
  push_ma: 300           # 더 미는 동안 닿음 기준보다 이만큼 더 오르면 그만 민다(너무 셈)
  push_yaw_deg: 0        # [가정] 11-16 찌르는 방향 = 벽 법선(world, 0 = AMR 정면 벽에 수직). 손끝이 벽에 수직인 곧은 선으로 들어간다
                         # (막대만 밑동 쪽으로 기욺). null = 11-16 전 방사 방향(밑동 → 버튼) — 10-22 실물: 버튼이 옆 10~12 cm
                         # (밑동 11°)일 때 9 번 중 1 번 눌림, 정면 7 번 중 3 번. AMR 이 벽에 비스듬히 서면 그 각도만큼 틀린다
  seek: 0.02             # [가정] 11-16 누름점(면 + depth)까지 안 닿으면 같은 선으로 이만큼 더 밀며 닿음을 찾는다. 10-22 실물:
                         # 크기로 잰 거리가 ±2.5 cm 흔들려 '닿음 감지 없음' 6/19
floor:                   # f1~f4 = 엘베 안 오른쪽 벽 층 버튼(3.5 cm, 3층 0.91 m 사용자 실측). 관찰 자세 right
  pose: right
  path: right            # 사용자가 토크를 풀고 홈 → 관찰 자세를 손으로 옮긴 길(config/paths/right.yaml, record_path.py, 10-22 17:25).
                         # 관찰 자세 = 길 끝(위팔 뒤로 55°·카메라 바닥 0.90 m·밑동 축에서 13 cm, 3층은 화면 (319, 149)·47 cm). 홈 ↔ 관찰은
                         # 이 길을 그대로(올 땐 거꾸로) 따라간다 — "직접 했을 때 안 부딪혔다"(사용자). 없으면 look_joints·세우고 돌기
  path_speed: 0.5        # 기록한 길을 따라갈 때 가장 많이 도는 관절의 최대 속도 rad/s(사람 손 속도는 안 따름)
  look_joints: [-1.491, -0.183, 0.361, 0.038]   # path 가 없을 때. 16:22 손으로 잡은 관찰 자세(판에서 약 25 cm·아래로 12°)
                         # (옆 범퍼 → 버튼판 0.58 m 사용자 실측 = 팔 축 → 판 약 0.634 m)
  cam_h: 0.95            # look_joints 가 없을 때. 0.88 은 어깨 −95° 라 위팔이 짐칸에 겹침(10-21 가짜 팔 MoveIt)
  z_up: 0.06             # [가정] 10-22 17:28 실물(z_up 0.01): 접근점 사진에서 막대 줄이 3층 가운데보다 약 5 cm 아래(2층 쪽).
                         # 관찰 자세가 팔을 뒤로 접은 자세라(카메라 밑동 근처) 63 cm 뻗을 때 처짐이 관찰 때 없다 — 호출 버튼 0.067 과 같은 까닭
  depth: 0.005
  contact_ma: 350        # [가정] 10-22 17:28 실물: 200 은 누르기 출발 0.37 s 에 가짜 닿음(사진상 거의 안 움직임). 옆으로 길게 뻗은 채
                         # 더 뻗어 어깨·팔꿈치 전류가 출발할 때 오른다. 다음 실물의 '전류 기준 대비 최대 오름' 줄로 다시 맞출 것
  push: 0.009            # 닿은 뒤 지금 자세에서 앞으로만 더 미는 거리(호출 버튼과 같게)
  push_ma: 300
  push_yaw_deg: null     # 11-16 엘베 안은 방사 방향 그대로(층 버튼이 바로 오른쪽이라 거의 같다). 벽에 수직으로 하려면 −90
  seek: 0.0              # 층 버튼은 두 번 누르면 취소 — 실물로 닿음 기준(contact_ma)을 맞추기 전에는 더 밀며 찾지 않는다
  retract: 0.03          # 아래 난간·이웃 층 버튼이 있어 짧게 곧게 뺀 뒤 홈(실물 확인 전)
  need_light: false      # 층 버튼 불빛 색은 아직 못 봄 → 불이 안 보여도 전류로 닿았으면 성공. 두 번 누르면 취소라 다시 안 누름
  watch: false           # true = 서비스 /arm/press_f* 가 누르고 불을 보면 '지켜보는 중' 으로 바로 답하고, 팔은 접근점에서 그 불이
                         # 꺼질 때(= 그 층 도착)까지 본 뒤 홈. NX 는 문이 열리면 /arm/my_floor 로 묻는다(10-21 가짜 팔 확인).
                         # NX 가 이 순서를 쓰기 전에는 false — 답을 받고도 팔이 펴져 있으면 NX 가 홈인 줄 안다. 손 명령은 --watch
  watch_sec: 300         # 이만큼 지나도 안 꺼지면 홈으로 가고 실패로 끝낸다
  guard_margin: 0.12     # [가정] 손 감시 칸 끝 = 벽 − 이만큼. 난간이 벽에서 8 cm 튀어나와 있어 기본 5 cm 면 난간이 늘 빨간불
  handrail:              # 층 버튼 아래 난간(사용자 실측). 누르는 동안만 MoveIt 장애물로 넣었다 뺀다
    protrusion: 0.08     # 벽(찾은 버튼 면)에서 로봇 쪽으로 튀어나온 길이
    z_bottom: 0.78       # 바닥에서 아래 끝
    z_top: 0.82          # 윗면(0.81~0.82 m, 굵기 3~4 cm 가정)
    length: 1.0          # 벽을 따라 버튼 앞뒤로 넣을 길이
guard:                   # 손 감시(길목 신호등, tools/path_guard.py) — 11-02 누르기에 붙임. 관찰 자세에서 버튼 쪽으로 가는 동안
                         # 손목 깊이 화면 가운데 네모 × (카메라 앞 ~ 버튼 벽 − margin) 칸에 뭔가 들어오면 빨간불(/path_guard/blocked,
                         # 확인 화면 /path_guard/image) → 그 자리에서 멈춤(MoveIt stop) → 초록불이 clear_sec 이어지면 지금 자세에서
                         # 다시 계획해 이어감. wait_sec 넘게 빨간불이면 그만두고 홈으로 돌아감(손 감시 끄고, 전류 감시만). 빼기·홈 동안은 안 본다
  enabled: true
  margin: 0.05           # 칸 끝 = 버튼 벽 − 이만큼(버튼판 튀어나옴 포함). 엘베 안은 floor.guard_margin
  min_wall: 0.45         # 카메라 → 벽이 이보다 가까우면 안 본다. Astra 는 0.36 m 안을 못 재 벽이 빈칸이 된다(= 늘 렌즈 가림).
                         # 호출 버튼: 관찰 자세(약 0.6 m)에서 출발해 처음 15 cm 남짓만 본다. 그 안은 전류 감시만
  roi: null              # 원본(거꾸로 된) 화면 네모 [u0, v0, u1, v1]. 비우면 가운데 160 × 160. 막대는 맨 위 약 90 줄에 보인다
  clear_sec: 1.0         # 11-02 사용자: 손이 빠지면 이어감. 초록불이 이만큼 이어져야
  wait_sec: 20           # 이만큼 넘게 빨간불이면 그만두고 홈(11-02 사용자: 20초 버티고 제자리로). NX 서비스 제한 120 s 안
  required: false        # true = 깊이 화면이 없으면 누르지 않고, 보는 중 stale_sec 끊기면 빨간불로 본다
  stale_sec: 0.5
  face_deg: 15           # 밑동이 버튼 쪽에서 이보다 비껴 있으면 카메라가 벽을 안 보는 것으로 보고 안 본다
hand:                    # 손 인식(tools/hand_guard.py, MediaPipe Hands) — 11-02. bash run/all.sh camera:=true 일 때 뜬다.
                         # 가까운 손이 보이면 빨간불(/hand_guard/detected) → press.py 가 어느 단계든 그 자리에서 멈춤 →
                         # 손이 빠져 초록불이 guard.clear_sec 이어지면 다시 계획해 이어감, guard.wait_sec 넘으면 실패·홈으로
  max_dist: 0.8          # [가정] 손 거리(손 관절 자리 깊이 중앙값)가 이보다 가까우면 빨간불. 깊이 못 잼(0.36 m 안)도 빨간불.
                         # 11-02 관찰 자세 사진에서 1 m 넘게 떨어진 책상 위 손도 잡혀 거리로 거른다
  on_n: 2                # 손이 이만큼 장 이어지면 빨간불(약 6~8 장/s 라 0.3 s 안팎)
  off_n: 3               # 손이 이만큼 장 안 보이면 초록불
  min_score: 0.5         # MediaPipe 손 신뢰도
  stale_sec: 0.6         # press.py: 손 인식 답이 이보다 오래 안 오면 손 인식은 없는 것으로 본다(camera:=false 와 같음)
lit:                     # 불빛으로 눌림 확인. 카메라와 막대가 한 몸이라 닿은 순간 버튼은 늘 막대 끝 옆에 보인다 →
                         # 그 고정 칸에서 '밝은 빨강' 점이 늘면 불 켜짐. 미는 중에 켜지면 바로 멈추고, 전류로 먼저 멈추면
                         # 닿은 채 confirm_sec 까지 기다린다. 카메라 화면이 없으면 전류(contact_ma)로만. 전류 감시는 늘 켠다
  enabled: true
  region: [150, 320, 490, 420]   # 바로 세운 화면(sheet.jpg)의 x1 y1 x2 y2. 10-21 실물 불빛: 막대 양옆 x 214~379, y 354~385
  min_px: 100            # 접근점 기준보다 빨간 점이 이만큼 늘면 불 켜짐. 10-21 실물: 켜짐 225~485, 꺼짐 0~41
  frames: 2              # 연속 이만큼(30 Hz)이어야
  confirm_sec: 5.0       # 10-22 사용자: 2 → 3 → 5 s(19:06 '2 초 더 누르고 있도록'). 전류로 멈춘 뒤 불을 기다리는 최대 시간. 10-21 실물: 멈춘 뒤 1.2~1.9 s 사진에서 켜져 있음
  off_frames: 6          # 엘베 안 지켜보기: 불빛 칸 빨강이 켜짐·꺼짐 사이 30 % 아래로 이만큼(30 Hz) 이어지면 꺼짐
  sat_min: 100           # HSV 채도(0~255). 10-21 실물 불빛 중앙 230, 하위 10 % 136
  val_min: 120           # HSV 밝기(0~255). 10-21 실물 불빛 중앙 214, 하위 10 % 139
aim:                     # 가운데 맞추기(호출 버튼). 접근점 화면(바로 세운 것)에서 빨간 화살표가 target 에 오게 손끝을 옮긴다.
                         # 10-21 저녁 실물 접근점 사진: 눌린 3 회 화살표 (309, 232·259·259), 아래를 누른 2 회 y 213·216 px
  target: [309, 250]     # [가정] 눌린 회차 평균. 더 모이면 다시 맞춘다
  window: [170, 120, 470, 335]   # 화살표를 찾을 칸(막대 아래쪽은 뺀다)
  sat_min: 70            # 화살표 빨강(꺼진 버튼의 인쇄 화살표라 불빛보다 어둡다)
  val_min: 60
  min_px: 150            # 덩어리 크기
  max_px: 4000
  ring_v_min: 120        # 덩어리 둘레 밝기(0~255) 이상이어야 화살표(버튼 면은 밝고, 위 층 표시기 LED 숫자는 둘레가 검다)
  frames: 5              # 이만큼 장의 중앙값
  tol_m: 0.003           # 이 안이면 가운데로 본다
  tries: 2               # 접근점을 다시 잡는 최대 번수
  max_m: 0.015           # 한 번에 이보다 크게 고쳐야 하면 버튼이 접근점 가운데 근처에 없거나 다른 빨강을 본 것(실물 실패 회차 1.1~1.2)
  require: true          # 화살표를 못 찾거나·너무 크거나·다시 봐도 안 줄면 누르지 않고 홈(실패 답)
mid:                     # 중간 확인점(호출 버튼). 10-22 실물: 같은 높이를 시켜도 접근점 막대가 버튼 위 0.5~6 cm 로 회마다 달랐다
                         # (자율주행으로 서는 자리·팔 자세가 매번 다르다). 팔을 거의 누르는 자세로 뻗은 채 30 cm 에서 다시 찾는다
  standoff: 0.20         # 버튼 앞 이 거리에 막대 끝(카메라는 버튼에서 약 0.30 m)
  pitch_deg: 15          # 막대를 아래로 숙인다. 막대가 화면 아래를 가려서 — 막대가 버튼보다 위 약 8 cm·아래 약 6 cm 까지 보인다
  z_up: 0.0              # 다시 찾은 버튼 높이에 더함. 10-22 실물: +0.01 은 위(18:59, 닿음 못 잡고 판을 타고 올라가 층 표시기 앞),
                         # −0.01 은 막대 윗면이 버튼 아래 테두리에 닿아 불 안 켜짐(19:04, 사용자 "살짝 아래") → 0.0.
                         # 손 명령은 press.sh down --observe --yes --mid-z-up 값
  tries: 3               # 다시 보기 최대 번수(고친 자리로 옮겨 다시 본다)
  tol_m: 0.01            # 고칠 양이 이 안이면 확인 끝
  max_m: 0.10            # 한 번에 이보다 크게 다르면 다른 것을 본 것 → 누르지 않고 홈
  wait_sec: 3.0          # 멈춘 뒤 buttons.py 가 버튼 위치를 낼 때까지 기다리는 최대 시간
demo:                    # 시연(tools/demo.py, run/demo.sh): 카메라 없이 손으로 기록한 길(config/paths/<이름>.yaml)로 홈 → 관찰 → 누르기 → 홈
  service_target: down   # 11-25 NX 앱 실행 버튼 /arm/demo(arm_service.py) 가 누를 버튼. run/demo_hand.sh 와 같이 저장한 자리로(--blind)
  speed: 0.5             # 길 따라가는 관절 최대 rad/s
  z_up: 0.03             # [가정] 끝(버튼에 댄) 자세를 올림. 손으로 받쳐 기록한 자세보다 모터로 뻗으면 처진다. 첫 시연으로 맞출 것
  back: 0.03             # 버튼 앞 이만큼에서 멈췄다가 곧게 밀어 누른다. 누른 뒤에도 이만큼 뺀 뒤 길을 거꾸로
  reach: 0.03            # 기록한 끝 자세보다 이만큼 더까지 밀어 본다(그 전에 닿으면 멈춤)
  contact_ma: 300        # 닿음 = 버튼 앞 전류보다 이만큼 오름(엘베 안 실물 350, 호출 버튼 200)
  push: 0.009            # 닿은 뒤 더 미는 거리
  push_ma: 300
  press_vel: 0.05
  hold: 3.5              # 누른 채 머무는 초(10-22 사용자: 2 초 더)
  look: 1.0              # 기록 때 1.5 초 넘게 멈췄던 자리(관찰 자세)에서 멈추는 초
  rest: 3.0              # --loop 사이 쉬는 초
photos: ~/vica_arm_logs/press   # 누를 때 손목 카메라 사진(접근점 기준·멈춘 순간·불 확인)과 불빛 칸 빨강 점 수를 남긴다.
                         # 최근 100번만 남김. 비우면 안 남긴다. 실물 팔 도메인(77)이 아니면(가짜 팔 78·79) 그 옆
                         # press_test<도메인> 폴더·last_press_<버튼>_test<도메인>.json 에 따로 쓴다(11-16)
speed:                   # 속도 배율(MoveIt 최대 대비). 빠를수록 모터 전류가 오른다 — 단계마다 찍히는 '전류 최대'가
                         # 상한(어깨 1500·팔꿈치 1300·손목 400 mA)의 90 % 를 넘지 않는 데까지 올린다
  observe: 0.2           # 홈 → 관찰 자세(10-21 까지 0.1)
  approach: 0.2          # 관찰 자세 → 버튼 6 cm 앞(10-21 까지 0.1, 그때 전류 최대 어깨 759·팔꿈치 777 mA)
  press: 0.05            # 6 cm 앞 → 누르기. 높이 보정·닿음 기준(z_up 0.065·200 mA)을 이 속도로 맞췄다 — 바꾸면 다시 맞출 것
  retract: 0.15          # 10-21 실물: 빼기에서 팔꿈치·손목이 상한에 닿아 손목이 떨림 → 호출 버튼은 빼기 없이 바로 홈
  home: 0.15             # 11-25 0.25 → 0.15: 홈 복귀가 가장 빨라 링크 일체형 팔이 4 Hz 로 가장 크게 출렁임(어깨 4~5 °/s). 이전: 10-21 실물 전류 최대 어깨 901~1084 mA
