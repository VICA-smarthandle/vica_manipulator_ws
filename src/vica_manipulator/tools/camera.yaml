# 웹캠 설정과 줄자 실측값. 사용자가 채운다.
# (fx 는 detect.py --calib 가 calib.json 에 따로 저장하므로 여기 적지 않는다)

device: /dev/video2        # SNAP U2. 노트북 내장 캠은 /dev/video0
width: 1280
height: 720

# 화면의 up/down 박스가 감싸는 부분의 실제 지름 (m). 자로 잰다
button_diameter_m: 0.02

# 거리 보정 — 줄자와 비교해 화면 Z 가 항상 짧게(길게) 나오면 그만큼 더한다(뺀다). m
z_offset_m: 0.03      # 2026-10-05 줄자 대비 약 3 cm 짧게 읽음

# 카메라 렌즈 위치 — world(팔 기둥 바닥 중심) 기준, m
x: -0.42        # 앞(+) / 뒤(-)     줄자 -0.50 → 누름 시험에서 버튼이 8 cm 더 앞 → 보정
y: 0.10         # 왼쪽(+) / 오른쪽(-)  줄자 -0.02 → 누름 시험 2회로 +12 cm 보정   팔이 앞을 볼 때 기준
z: 0.61         # 기둥 바닥에서 위로

# 카메라 방향 — 팔과 같은 방향(앞)을 수평으로 보면 둘 다 0
pitch_deg: 0.0  # 아래로 숙이면 +
yaw_deg: 0.0    # 왼쪽으로 돌리면 +
